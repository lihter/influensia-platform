# ⚠️ NOT DEPLOYED — blocked on our account: the managed service control policy of the new AWS experience denies
#    iam:*OpenIDConnectProvider* (verified 2026-10-06). Deploys use the pull model instead (deploy/autodeploy.sh).
#    Kept for the day "advanced features" are activated on the AWS project; then a push model becomes possible.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Influensia CI/CD - lets GitHub Actions (main branch of one repo only) run deploy/update.sh on the app server through
  SSM Run Command. Keyless: GitHub's OIDC token is exchanged for a 1-hour role session; no AWS keys are stored in GitHub.
  Separate from the `influensia` stack on purpose: updating that stack re-resolves the Ubuntu AMI parameter and can
  replace the server. Deploy in eu-north-1. See docs/DEPLOY_AWS.md "Automatic deploys".

Parameters:
  GitHubRepo:
    Type: String
    Default: lihter/influensia-platform
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubBranch:
    Type: String
    Default: main
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: "The app server (Outputs -> InstanceId of the influensia stack)"
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "false if this AWS account already has the token.actions.githubusercontent.com identity provider"

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: influensia-github-deploy
      Description: GitHub Actions deploy of the Influensia app (SSM Run Command on one instance only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: run-deploy-on-app-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunShellOnTheAppServerOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadCommandResults
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Put into .github/workflows/deploy.yml (env AWS_ROLE_ARN) - not a secret
    Value: !GetAtt DeployRole.Arn
